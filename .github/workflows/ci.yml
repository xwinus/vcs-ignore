name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  cabal:
    name: Cabal / ${{ matrix.os }} / GHC ${{ matrix.ghc }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ghc: "9.10.3"
          - os: ubuntu-latest
            ghc: "9.12.4"
          - os: ubuntu-latest
            ghc: "9.14.1"
          - os: macos-latest
            ghc: "9.10.3"
          - os: windows-latest
            ghc: "9.10.3"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Haskell
        id: setup-haskell-cabal
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: latest

      - name: Cache Cabal store
        uses: actions/cache@v6
        with:
          path: ${{ steps.setup-haskell-cabal.outputs.cabal-store }}
          key: ${{ runner.os }}-cabal-${{ matrix.ghc }}-${{ hashFiles('vcs-ignore.cabal') }}
          restore-keys: |
            ${{ runner.os }}-cabal-${{ matrix.ghc }}-

      - name: Install dependencies
        run: cabal build all --enable-tests --only-dependencies

      - name: Build
        run: cabal build all --enable-tests

      - name: Test
        run: cabal test spec --enable-tests --test-show-details=direct

      - name: Doctest
        if: matrix.os == 'ubuntu-latest' && matrix.ghc == '9.10.3'
        run: |
          cabal install doctest --ignore-project --overwrite-policy=always
          cabal repl lib:vcs-ignore \
            --with-compiler="$(cabal -v0 path --installdir)/doctest" \
            --repl-options='-w -Wdefault'

  stack:
    name: Stack / LTS 24.57
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Stack
        id: setup-haskell-stack
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: latest
          stack-no-global: true

      - name: Cache Stack
        uses: actions/cache@v6
        with:
          path: ${{ steps.setup-haskell-stack.outputs.stack-root }}
          key: ${{ runner.os }}-stack-${{ hashFiles('stack.yaml.lock') }}
          restore-keys: |
            ${{ runner.os }}-stack-

      - name: Set up GHC
        run: stack setup

      - name: Install dependencies
        run: stack build --test --no-run-tests --only-dependencies

      - name: Build
        run: stack build --test --no-run-tests

      - name: Test
        run: stack test
