name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  source:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.10.3"
          cabal-version: latest

      - name: Verify tag and package version
        run: |
          package_version="$(awk '$1 == "version:" { print $2; exit }' package.yaml)"
          test "$GITHUB_REF_NAME" = "v${package_version}"

      - name: Check package metadata
        run: cabal check

      - name: Build source distribution
        run: cabal sdist --output-dir release

      - name: Upload source distribution
        uses: actions/upload-artifact@v7
        with:
          name: release-source
          path: release/*.tar.gz
          compression-level: 0
          if-no-files-found: error

  binary:
    name: Binary / ${{ matrix.os }} / GHC 9.10.3
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.10.3"
          cabal-version: latest

      - name: Build executable
        run: |
          cabal install exe:ignore \
            --install-method=copy \
            --overwrite-policy=always \
            --installdir=dist

      - name: Package executable
        run: |
          executable=ignore
          if [ "$RUNNER_OS" = Windows ]; then
            executable=ignore.exe
          fi
          archive="ignore-${GITHUB_REF_NAME#v}-${RUNNER_OS}-${RUNNER_ARCH}.tar.gz"
          mkdir release
          tar -czf "release/${archive}" -C dist "$executable"

      - name: Upload executable archive
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ runner.os }}-${{ runner.arch }}
          path: release/*.tar.gz
          compression-level: 0
          if-no-files-found: error

  release:
    name: Draft GitHub release
    needs:
      - source
      - binary
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Create checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS

      - name: Create or update draft release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --draft \
              --generate-notes \
              --title "Release ${GITHUB_REF_NAME}" \
              --verify-tag
          fi
