name: vcs-ignore
version: 0.1.0.0
homepage: https://github.com/xwinus/vcs-ignore
license: BSD-3-Clause
license-file: LICENSE
github: xwinus/vcs-ignore
author: Vaclav Svejcar
maintainer: vaclav.svejcar@gmail.com
copyright: Copyright (c) 2020-2026 Vaclav Svejcar
category: Development

synopsis: Query Git ignore rules and traverse visible repository entries.
description: >
  vcs-ignore provides lazy Git ignore queries and a pruning, early-stopping
  repository traversal built on one shared rule engine.


extra-source-files:
  - README.md
  - test-data/fake-git-repo/.gitignore
  - test-data/fake-git-repo/a/*
  - test-data/fake-git-repo/a/.gitignore
  - test-data/fake-git-repo/a/b/*
  - test-data/fake-git-repo/a/b/.gitignore
  - test-data/list-files/*
  - test-data/list-files/dir1/*
  - test-data/list-files/dir1/dir2/*

extra-doc-files:
  - CHANGELOG.md
  - RELEASING.md

dependencies:
  - base >= 4.20 && < 4.23
  - containers >= 0.6 && < 0.9
  - directory >= 1.3.8 && < 1.4
  - filepath >= 1.4.2 && < 1.6
  - text >= 2.0 && < 2.2

ghc-options:
  - -optP-Wno-nonportable-include-path
  - -Wall
  - -Wcompat
  - -Widentities
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wpartial-fields
  - -Wredundant-constraints
  - -Werror=incomplete-patterns

library:
  exposed-modules:
    - Data.VCS.Ignore
    - Data.VCS.Ignore.Git
    - Data.VCS.Ignore.Types
  other-modules:
    - Data.VCS.Ignore.Git.Internal.Pattern
    - Data.VCS.Ignore.Git.Internal.Repository
    - Data.VCS.Ignore.Git.Internal.Traversal
  generated-other-modules: Paths_vcs_ignore
  source-dirs: src
  dependencies:
    - Glob >= 0.10.2 && < 0.11

executables:
  ignore:
    main: Main.hs
    source-dirs: app
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - optparse-applicative >= 0.18 && < 0.19
      - vcs-ignore

tests:
  spec:
    main: Spec.hs
    source-dirs:
      - src
      - test
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - Glob >= 0.10.2 && < 0.11
      - hspec
      - process
      - temporary
    build-tools: hspec-discover
benchmarks:
  repository-traversal:
    main: Main.hs
    source-dirs: benchmark
    dependencies:
      - criterion
      - temporary
      - vcs-ignore
